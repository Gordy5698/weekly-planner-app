<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222536;
      --border: #2e3250;
      --text: #e8eaf6;
      --muted: #8b90b8;
      --work-late: #3b4fc8;
      --work-early: #1a8a6e;
      --work-night: #6b21a8;
      --gym: #b45309;
      --run: #0e7490;
      --trade: #15803d;
      --event: #be123c;
      --rest: #374151;
      --accent: #6366f1;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    header p {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.9rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .week-block {
      margin-bottom: 36px;
    }

    .week-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.15s;
    }

    .day-card:hover {
      transform: translateY(-2px);
    }

    .day-card.today {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .day-name {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .day-date {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
    }

    .today-badge {
      background: var(--accent);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .events {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .event {
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .event .time {
      font-size: 0.68rem;
      opacity: 0.8;
      display: block;
      margin-bottom: 1px;
    }

    .event.work-late  { background: rgba(59,79,200,0.25); border-left: 3px solid var(--work-late); color: #a5b4fc; }
    .event.work-early { background: rgba(26,138,110,0.25); border-left: 3px solid var(--work-early); color: #6ee7b7; }
    .event.work-night { background: rgba(107,33,168,0.25); border-left: 3px solid var(--work-night); color: #d8b4fe; }
    .event.gym        { background: rgba(180,83,9,0.25);  border-left: 3px solid var(--gym);  color: #fbbf24; }
    .event.run        { background: rgba(14,116,144,0.25); border-left: 3px solid var(--run); color: #67e8f9; }
    .event.trade      { background: rgba(21,128,61,0.25); border-left: 3px solid var(--trade); color: #86efac; }
    .event.special    { background: rgba(190,18,60,0.25); border-left: 3px solid var(--event); color: #fda4af; }
    .event.rest       { background: rgba(55,65,81,0.3);  border-left: 3px solid var(--rest);  color: #9ca3af; }
    .event.note       { background: rgba(99,102,241,0.1); border-left: 3px solid var(--accent); color: #c7d2fe; font-size: 0.72rem; }

    .rest-day {
      color: var(--muted);
      font-size: 0.8rem;
      font-style: italic;
      padding: 4px 0;
    }

    @media (max-width: 480px) {
      .days-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

  const label = document.createElement('div');
  label.className = 'week-label';
  label.innerHTML = week.week;
  block.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'days-grid';

  week.days.forEach(day => {
    const card = document.createElement('div');
    card.className = 'day-card' + (day.today ? ' today' : '');

    const header = document.createElement('div');
    header.className = 'day-header';

    const nameDate = document.createElement('div');
    nameDate.innerHTML = `<div class="day-name">${day.name}</div><div class="day-date">${day.date}</div>`;

    if (day.today) {
      const badge = document.createElement('span');
      badge.className = 'today-badge';
      badge.textContent = 'TODAY';
      header.appendChild(badge);
    }

    card.appendChild(header);

    const events = document.createElement('div');
    events.className = 'events';

    day.events.forEach(ev => {
      const el = document.createElement('div');
      el.className = `event ${ev.type}`;
      el.innerHTML = (ev.time ? `<span class="time">${ev.time}</span>` : '') + ev.label;

    });

    card.appendChild(events);
    grid.appendChild(card);
  });

  block.appendChild(grid);
